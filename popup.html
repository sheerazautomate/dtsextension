<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>DTS Auto-Login</title>
<style>
  body { font-family: system-ui, sans-serif; width: 300px; padding: 14px; }
  h3 { margin: 0 0 10px; font-size: 15px; }
  h4 { margin: 14px 0 6px; font-size: 12px; color: #555; text-transform: uppercase; letter-spacing: .04em; }
  button { margin-top: 8px; width: 100%; padding: 8px; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
  button:hover { opacity: 0.9; }
  #status { margin-top: 8px; font-size: 12px; color: #16a34a; min-height: 14px; }
  .statbox { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 6px; padding: 8px 10px; font-size: 12px; line-height: 1.6; }
  .statbox .k { color: #64748b; }
  .badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #fff; }
  .badge.on { background: #16a34a; }
  .badge.off { background: #dc2626; }
  .btn-start { background: #16a34a; }
  .btn-stop { background: #dc2626; }
  .btn-settings { background: #475569; }
  .hint { font-size: 11px; color: #666; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>
  <h3>DTS Dashboard Auto-Login</h3>

  <button id="start" class="btn-start">▶ Start (follow schedule)</button>
  <button id="stop" class="btn-stop">⏹ Stop</button>
  <button id="openSettings" class="btn-settings">⚙️ Settings</button>
  <div id="status"></div>

  <h4>Live Status</h4>
  <div class="statbox">
    <div><span class="k">Network:</span> <span id="netBadge" class="badge off">Checking…</span></div>
    <div><span class="k">Flow step:</span> <span id="flowStepText">—</span></div>
    <div><span class="k">Next run:</span> <span id="nextRunText">—</span></div>
    <div><span class="k">Last success:</span> <span id="lastSuccessText">—</span></div>
    <div><span class="k">Last error:</span> <span id="lastErrorText">—</span></div>
  </div>

  <div class="hint">Configure credentials & schedule in Settings. Click Start to follow the configured schedule on the dashboard.</div>
</body>
<script src="popup.js"></script>
</html>
